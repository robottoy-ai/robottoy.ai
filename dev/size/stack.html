<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v2 Exploded Stack</title>
<style>
  :root { --bg:#faf7f2; --fg:#3a0a22; --mut:#8a7580; --gum:#d6336c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1c1218; --fg:#f3e8ee; --mut:#a08898; color-scheme:dark; } }
  :root[data-theme="dark"] { --bg:#1c1218; --fg:#f3e8ee; --mut:#a08898; color-scheme:dark; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.5 -apple-system, system-ui, sans-serif;
    padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:16px; }
  h1 { font-size:1.2rem; margin:0 0 4px; }
  p { color:var(--mut); margin:0 0 10px; font-size:.9rem; }
  model-viewer { width:100%; height:80vh; background:transparent; }
  .tag { background:var(--gum); color:#fff; border:0; border-radius:10px;
    padding:2px 9px; font-size:12px; white-space:nowrap; pointer-events:none;
    opacity:.95; transform:translate(-50%,-50%); }
  a { color:var(--gum); }
</style>
</head>
<body>
<h1>Penguin v2 — exploded layer stack</h1>
<p>The seven layers pulled apart, bottom to top: shell, fastening, actuation, electronics, harness, sensing, skin. <a href="../layers.html">What each layer promises</a> · <a href="fit.html">assembled fit</a>.</p>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<model-viewer src="layer-stack.glb" camera-controls camera-orbit="35deg 80deg 3.2m" min-camera-orbit="auto auto 0.3m">
  <button class="tag" slot="hotspot-l1" data-position="0.13m 0.1m 0m">L1 shell (2 halves)</button>
  <button class="tag" slot="hotspot-l2" data-position="0.13m 0.33m 0m">L2 brass inserts</button>
  <button class="tag" slot="hotspot-l3" data-position="0.13m 0.56m 0m">L3 actuation</button>
  <button class="tag" slot="hotspot-l4" data-position="0.13m 0.81m 0m">L4 electronics</button>
  <button class="tag" slot="hotspot-l5" data-position="0.13m 1.09m 0m">L5 harness</button>
  <button class="tag" slot="hotspot-l6" data-position="0.13m 1.35m 0m">L6 sensing</button>
  <button class="tag" slot="hotspot-l7" data-position="0.13m 1.6m 0m">L7 skin</button>
</model-viewer>
</body>
</html>
