<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Penguin Engineering Primer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one reading column. Home lists the subjects; each subject page runs plain idea -> picture -> the few
   fundamentals -> how to judge -> a story from our build -> words -> self-check. Green marks good signs, red marks warnings. */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --ink: #15202b; --muted: #586675; --line: #d4dbe3; --tint: #e8eef5;
  --move: #d9650a; --motor: #235fa6; --ok: #1c7c46; --bad: #c2362b;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e141a; --surface: #162029; --ink: #e6ebf0; --muted: #97a5b3; --line: #2a3642; --tint: #1c2835;
  --move: #ff9a3d; --motor: #62a8f0; --ok: #4cc38a; --bad: #ff7466; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e141a; --surface: #162029; --ink: #e6ebf0; --muted: #97a5b3; --line: #2a3642; --tint: #1c2835;
  --move: #ff9a3d; --motor: #62a8f0; --ok: #4cc38a; --bad: #ff7466; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.6; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 22px 64px; display: flex; flex-direction: column; gap: 26px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -0.01em; font-weight: 600; }
h1 { font-size: clamp(1.8rem, 6vw, 2.5rem); line-height: 1.1; }
h2 { font-size: 1.28rem; line-height: 1.25; }
h3 { font-size: 1.02rem; }
p { margin: 0; }
a { color: var(--motor); text-underline-offset: 2px; }
a:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--move); outline-offset: 2px; }
.eyebrow { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); }
.asks { font-size: 1.2rem; color: var(--muted); }
.lede { font-size: 1.08rem; }
nav.top { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.9rem; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
nav.top a { color: var(--muted); text-decoration: none; }
nav.top a[aria-current="page"] { color: var(--ink); font-weight: 600; }
section { display: flex; flex-direction: column; gap: 12px; }
.rule { border-top: 2px solid var(--ink); padding-top: 18px; }
.list { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 11rem minmax(0, 1fr); gap: 2px 16px; padding: 12px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
.row b { color: var(--motor); font-weight: 600; }
.row span { color: var(--muted); }
@media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
.start { display: block; background: var(--surface); border: 1px solid var(--ink); border-radius: 4px; padding: 16px 18px; text-decoration: none; color: inherit; }
.start b { display: block; font-size: 1.15rem; color: var(--ink); }
.start span { color: var(--muted); }
figure { margin: 0; display: flex; flex-direction: column; gap: 6px; color: var(--ink); }
figure svg { width: 100%; height: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; }
figure svg text { font-family: var(--sans); fill: var(--ink); }
figcaption { font-size: 0.9rem; color: var(--muted); }
.ideas { display: flex; flex-direction: column; gap: 16px; }
.idea { display: flex; flex-direction: column; gap: 4px; }
.onp { font-size: 0.93rem; color: var(--muted); border-left: 3px solid var(--move); padding-left: 10px; }
.onp::before { content: "On the penguin: "; font-weight: 600; color: var(--ink); }
ul { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 6px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 22px; }
@media (max-width: 560px) { .two { grid-template-columns: 1fr; } }
.two > div { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.good h3 { color: var(--ok); } .badc h3 { color: var(--bad); }
.story { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
.story .eyebrow { color: var(--move); }
dl { margin: 0; display: grid; grid-template-columns: minmax(8rem, 13rem) minmax(0, 1fr); gap: 6px 16px; }
dt { font-weight: 600; }
dd { margin: 0; color: var(--muted); }
@media (max-width: 560px) { dl { grid-template-columns: 1fr; gap: 0; } dd { margin-bottom: 10px; } }
details { border-bottom: 1px solid var(--line); padding: 10px 0; }
summary { cursor: pointer; font-weight: 500; }
details p { margin-top: 8px; color: var(--muted); }
.pager { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 0.95rem; }
.q { display: flex; flex-direction: column; gap: 6px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.q .n { font-family: var(--mono); color: var(--muted); font-size: 0.85rem; }
.ws { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; font-size: 0.93rem; }
@media (max-width: 560px) { .ws { grid-template-columns: 1fr; } }
.ws .w { color: var(--bad); } .ws .s { color: var(--ok); }
.ws .w::before { content: "Weak: "; font-weight: 600; } .ws .s::before { content: "Strong: "; font-weight: 600; }
.filter { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--ink); width: 100%; max-width: 360px; }
.tag { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
.note { color: var(--muted); font-size: 0.93rem; }
.demo { background: var(--surface); border: 1px solid var(--ink); border-radius: 4px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; color: var(--ink); }
.demo-h { display: flex; flex-direction: column; gap: 2px; }
.demo-h b { font-size: 1.05rem; }
.demo-h span { color: var(--muted); font-size: 0.93rem; }
.demo svg { width: 100%; height: auto; display: block; background: var(--bg); border-radius: 3px; }
.demo svg text { font-family: var(--sans); fill: var(--ink); }
.demo-c { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 16px; align-items: end; }
.demo-s { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.demo-s label { display: flex; justify-content: space-between; gap: 8px; font-size: 0.86rem; }
.demo-s output { font-family: var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.demo-s input { width: 100%; accent-color: var(--move); height: 30px; margin: 0; }
.demo-b { font: 600 0.9rem var(--sans); min-height: 44px; padding: 8px 14px; border: 1px solid var(--ink); border-radius: 4px; background: transparent; color: var(--ink); cursor: pointer; }
.demo-b:focus-visible { outline: 2px solid var(--move); outline-offset: 2px; }
.demo-o { font-weight: 500; min-height: 3.2em; }
.demo-o.ok { color: var(--ok); } .demo-o.bad { color: var(--bad); }
</style>
</head>
<body>

<div class="wrap">
  <nav class="top" id="nav" aria-label="Sections"></nav>
  <main id="view" class="wrap" style="padding:0;gap:26px"></main>
</div>

<script src="content1.js"></script>
<script src="content2.js"></script>
<script src="content3.js"></script>
<script src="demos.js"></script>
<script>
const T = PRIMER.topics, K = PRIMER.toolkit, $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const li = a => '<ul>' + a.map(x => `<li>${esc(x)}</li>`).join('') + '</ul>';

function home() {
  return `<header style="display:flex;flex-direction:column;gap:10px">
      <p class="eyebrow">Built from the penguin project · ${T.length} subjects · plain words</p>
      <h1>The fundamentals behind the penguin</h1>
      <p class="lede">Each page takes one field of engineering we have actually used. Each page starts with something you can move with your finger. Then it gives the few ideas everything else hangs from, the words you will hear, and how to tell good work from weak work. Every example is from our own build, including the mistakes.</p>
    </header>
    <a class="start" href="#judge"><b>Start here: how to judge engineering</b><span>Seven questions that work in every field, the habits behind them, and how this maps to what you know from software.</span></a>
    <section class="rule"><h2>The subjects</h2>
      <div class="list">${T.map(t => `<a class="row" href="#${t.id}"><b>${esc(t.name)}</b><span>${esc(t.asks)}</span></a>`).join('')}</div>
    </section>
    <section><a class="row" href="#words"><b>All the words</b><span>Every term from every page, in one searchable list.</span></a>
      <p class="note">${esc(PRIMER.missing)}</p></section>`;
}

function topic(t) {
  const i = T.indexOf(t), prev = T[i - 1], next = T[i + 1];
  return `<header style="display:flex;flex-direction:column;gap:8px">
      <p class="eyebrow">Subject ${i + 1} of ${T.length}</p><h1>${esc(t.name)}</h1><p class="asks">${esc(t.asks)}</p></header>
    <section>${t.eli5.map(p => `<p class="lede">${esc(p)}</p>`).join('')}</section>
    <div class="demo" id="demo"></div>
    <section class="rule"><h2>The few ideas everything hangs from</h2>
      <div class="ideas">${t.ideas.map(d => `<div class="idea"><h3>${esc(d.t)}</h3><p>${esc(d.x)}</p><p class="onp">${esc(d.p)}</p></div>`).join('')}</div></section>
    <section class="rule"><h2>How to judge work in this field</h2>
      <h3>Ask</h3>${li(t.ask)}
      <div class="two"><div class="good"><h3>Good signs</h3>${li(t.good)}</div><div class="badc"><h3>Warning signs</h3>${li(t.bad)}</div></div></section>
    <div class="story"><p class="eyebrow">From our build</p><h3>${esc(t.story.h)}</h3><p>${esc(t.story.x)}</p></div>
    <section class="rule"><h2>Words you will hear</h2><dl>${t.jargon.map(j => `<dt>${esc(j[0])}</dt><dd>${esc(j[1])}</dd>`).join('')}</dl></section>
    <section class="rule"><h2>Check yourself</h2><p class="note">Answer in your head, then open it.</p>
      ${t.quiz.map(q => `<details><summary>${esc(q[0])}</summary><p>${esc(q[1])}</p></details>`).join('')}</section>
    <div class="pager">${prev ? `<a href="#${prev.id}">Back: ${esc(prev.name)}</a>` : '<a href="#judge">Back: how to judge</a>'}${next ? `<a href="#${next.id}">Next: ${esc(next.name)}</a>` : '<a href="#words">Next: all the words</a>'}</div>`;
}

function judge() {
  return `<header style="display:flex;flex-direction:column;gap:8px"><p class="eyebrow">Start here</p><h1>How to judge engineering</h1><p class="lede">${esc(K.lede)}</p></header>
    <section class="rule"><h2>The seven questions</h2>
      ${K.questions.map((q, i) => `<div class="q"><span class="n">${i + 1} of 7</span><h3>${esc(q.q)}</h3><p>${esc(q.why)}</p><div class="ws"><span class="w">${esc(q.weak)}</span><span class="s">${esc(q.strong)}</span></div></div>`).join('')}</section>
    <section class="rule"><h2>Six habits</h2><dl>${K.habits.map(h => `<dt>${esc(h[0])}</dt><dd>${esc(h[1])}</dd>`).join('')}</dl></section>
    <section class="rule"><h2>What you will notice in the room</h2>
      <div class="two"><div class="good"><h3>Good engineering sounds like</h3>${li(K.tells.good)}</div><div class="badc"><h3>Trouble sounds like</h3>${li(K.tells.bad)}</div></div></section>
    <section class="rule"><h2>If you already think in software</h2><p>The same instincts carry over. Only the names change.</p>
      <dl>${K.bridge.map(b => `<dt>${esc(b[0])}</dt><dd>${esc(b[1])}</dd>`).join('')}</dl><p>${esc(K.bridgeNote)}</p></section>
    <div class="pager"><a href="#">All subjects</a><a href="#${T[0].id}">Next: ${esc(T[0].name)}</a></div>`;
}

function words() {
  const all = T.flatMap(t => t.jargon.map(j => ({ term: j[0], plain: j[1], t }))).sort((a, b) => a.term.localeCompare(b.term));
  return `<header style="display:flex;flex-direction:column;gap:8px"><p class="eyebrow">${all.length} terms</p><h1>All the words</h1>
      <label for="f" class="note">Type to filter</label><input class="filter" id="f" type="search" autocomplete="off" placeholder="for example: torque"></header>
    <dl id="wl">${all.map(w => `<dt data-k="${esc((w.term + ' ' + w.plain).toLowerCase())}">${esc(w.term)} <a class="tag" href="#${w.t.id}">${esc(w.t.name)}</a></dt><dd>${esc(w.plain)}</dd>`).join('')}</dl>
    <p class="note" id="none" hidden>No term matches. Try a shorter word.</p>`;
}

let stopDemo = null;
function route() {
  const id = (location.hash || '').replace('#', '');
  const t = T.find(x => x.id === id);
  $('view').innerHTML = t ? topic(t) : id === 'judge' ? judge() : id === 'words' ? words() : home();
  $('nav').innerHTML = [['', 'All subjects'], ['judge', 'How to judge']].concat(T.map(x => [x.id, x.name]), [['words', 'Words']])
    .map(([h, n]) => `<a href="#${h}"${h === id ? ' aria-current="page"' : ''}>${esc(n)}</a>`).join('');
  if (stopDemo) { stopDemo(); stopDemo = null; }
  if (t && $('demo')) {
    try { stopDemo = PRIMER.demos[t.id]($('demo')); }
    catch (e) { $('demo').outerHTML = '<figure>' + t.pic + '<figcaption>' + esc(t.picCap) + '</figcaption></figure>'; }
  }
  const f = $('f');
  if (f) f.addEventListener('input', () => {
    const q = f.value.trim().toLowerCase(); let shown = 0;
    document.querySelectorAll('#wl dt').forEach(dt => { const hit = !q || dt.dataset.k.includes(q); dt.hidden = !hit; dt.nextElementSibling.hidden = !hit; if (hit) shown++; });
    $('none').hidden = shown > 0;
  });
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route); route();
</script>

</body>
</html>
